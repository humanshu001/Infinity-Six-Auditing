    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
    align-items: start;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .card h3 { margin: 0 0 4px 0; font-size: 15px; }
  .card .desc { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .chart-wrapper { width: 100%; height: 280px; min-width: 0; }
  .summary {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
    margin: 10px 0 20px 0;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .stat .lbl { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .stat .val { font-size: 18px; font-weight: 600; margin-top: 4px; }
  .stat .val.bad { color: var(--bad); }
  .stat .val.good { color: var(--good); }
  .stat .val.warn { color: var(--warn); }
  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    margin: 10px 0;
    flex-wrap: wrap;
  }
  .controls label { font-size: 13px; color: var(--muted); }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    background: #1f6feb22;
    color: var(--blue);
    font-size: 11px;
    margin-right: 6px;

  .pill.bad { background: #f8514922; color: var(--bad); }
  .pill.warn { background: #d2992222; color: var(--warn); }
  .note {
    color: var(--muted);
    font-size: 12px;
    margin: 16px 0;
    padding: 10px 12px;
    border-left: 3px solid var(--border);
  }
  .explainer {
    background: #161b22;
    border: 1px solid #30363d;
    border-left: 4px solid var(--bad);
    border-radius: 8px;
    padding: 20px 24px;
    margin: 16px 0 28px 0;
  }
  .explainer h3 {
    margin: 0 0 12px 0;
    color: var(--bad);
    font-size: 17px;
  }
  .explainer p {
    margin: 8px 0;
    line-height: 1.6;
    font-size: 14px;
    color: var(--text);
  }
  .explainer ol, .explainer ul {
    padding-left: 22px;
    line-height: 1.7;
    font-size: 14px;
  }
  .explainer li {
    margin: 4px 0;
  }
  .explainer .step {
    background: #0e1117;
    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    margin: 8px 0;
  }
  .explainer .step b { color: var(--warn); }
  .live-pill {
    display: inline-block;
    background: var(--bad);
    color: white;
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    margin-right: 8px;
  }
  .layman-card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 12px 14px;
    margin-top: 10px;
    font-size: 13px;
    line-height: 1.55;
    color: var(--text);

  .layman-card b { color: var(--warn); }

    background: #161b22;
    border: 1px solid #30363d;
    border-left: 4px solid var(--info);
    border-radius: 8px;

    margin: 16px 0 28px 0;

    color: var(--info);
    font-size: 17px;

  .kpi-card p {
    margin: 6px 0;
    line-height: 1.6;
    font-size: 14px;
    color: var(--text);

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-top: 14px;
  }
  .kpi-item {
    background: #0e1117;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;

  .kpi-item .kpi-name {

    border-radius: 3px;
    font-size: 12px;

const fmt = (n) => {
  if (n === 0) return "0";
  if (Math.abs(n) >= 1e15) return (n).toExponential(2);
  if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (Math.abs(n) >= 1e3) return (n / 1e3).toFixed(2) + "k";
  if (Math.abs(n) >= 1)   return n.toFixed(2);
  return n.toFixed(6);
};

function phaseLabel(step) {
  if (step === 0) return "seed";
  if (step === 9999) return "post-inv";
  if (step <= 9999) return "inv " + step;
  return "wd " + (step - 10000);
}

function mergedSeries(best, avg, worst, key) {
  const map = new Map();
  for (const r of best)  map.set(r.step, { step: r.step, BEST:  r[key] });
  for (const r of avg) {
    const existing = map.get(r.step) || { step: r.step };
    existing.AVG = r[key];
    map.set(r.step, existing);
  }
  for (const r of worst) {
    const existing = map.get(r.step) || { step: r.step };
    existing.WORST = r[key];
    map.set(r.step, existing);
  }
  return Array.from(map.values()).sort((a, b) => a.step - b.step);
}

function cumulative(waves) {
  let m = 0, p = 0;
  return waves.map((w) => {
    m += w.minted;
    p += w.pulled;
    return { wave: w.wave, cumMinted: Math.min(m, 1e8), cumPulled: p };
  });
}
